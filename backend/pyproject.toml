[project]
name = "agentrank"
version = "0.1.0"
description = "AgentRank: SEO and agent-readiness audits"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
